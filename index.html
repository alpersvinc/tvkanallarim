<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; display: flex; height: 100vh; }
        
        /* Yan Kanal Listesi */
        #sidebar { width: 250px; background: #252525; border-right: 1px solid #333; overflow-y: auto; }
        .channel-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #333; transition: 0.3s; }
        .channel-item:hover { background: #3d3d3d; }
        .channel-item.active { background: #e50914; font-weight: bold; }

        /* Video Alanı */
        #main { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; background: black; }
        video { width: 100%; max-height: 90vh; outline: none; }
        .info { padding: 10px; text-align: center; color: #aaa; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="text-align: center;">Kanal Listesi</h3>
    <div id="channel-list">
        <!-- Kanallar buraya gelecek -->
    </div>
</div>

<div id="main">
    <video id="video" controls autoplay></video>
    <div class="info" id="current-channel">Kanal seçiniz...</div>
</div>

<script>
    // IPTV sağlayıcından aldığın uzun .m3u veya .m3u8 linkini buraya yapıştır
const iptvM3uUrl = "http://andro2.vip:8080/get.php?username=B4FlnuXHSg&password=rHkeF3C9lX&type=m3u_plus&output=ts
"; 

const video = document.getElementById('video');
const channelList = document.getElementById('channel-list');
const currentInfo = document.getElementById('current-channel');
const hls = new Hls();

// M3U dosyasını indirip kanalları ayrıştıran fonksiyon
async function loadIptvChannels() {
    try {
        // IPTV linkini CORS proxy üzerinden çekiyoruz ki tarayıcı engellemesin
        const response = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(iptvM3uUrl)}`);
        const data = await response.text();
        
        const lines = data.split('\n');
        let currentChannelName = "";

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                // Kanal adını satırdan ayıkla (genellikle virgülünden sonrasıdır)
                const nameParts = line.split(',');
                currentChannelName = nameParts[nameParts.length - 1];
            } else if (line.startsWith('http')) {
                // Eğer satır link içeriyorsa ve bir kanal adı bulunmuşsa listeye ekle
                if (currentChannelName) {
                    createChannelItem(currentChannelName, line);
                }
            }
        });
    } catch (error) {
        console.error("IPTV Listesi yüklenirken hata oluştu:", error);
        currentInfo.innerText = "Liste yüklenemedi. Linki veya Proxy'yi kontrol edin.";
    }
}

function createChannelItem(name, url) {
    const div = document.createElement('div');
    div.className = 'channel-item';
    div.innerText = name;
    div.onclick = () => playChannel(url, name, div);
    channelList.appendChild(div);
}

function playChannel(url, name, element) {
    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    currentInfo.innerText = "Şu an izleniyor: " + name;

    // IPTV linkini oynatırken de CORS sorununu aşmak için proxy kullanabiliriz
    const proxiedUrl = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;

    if (Hls.isSupported()) {
        hls.loadSource(proxiedUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = proxiedUrl;
        video.addEventListener('loadedmetadata', () => video.play());
    }
}

// Sayfa açıldığında IPTV listesini yükle
loadIptvChannels();
</script>

</body>
</html>
